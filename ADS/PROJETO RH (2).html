<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH System - Integrado 2026</title>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
            --bg: #f4f6f9;
            --text: #1f2937;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); }

        /* UTILITÁRIOS */
        .hidden { display: none !important; }
        .btn { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }

        /* LOGIN */
        #tela-login {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }
        .card-login {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* DASHBOARD / LAYOUT */
        .layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
        aside { background: #1e293b; color: white; padding: 20px; }
        aside h2 { border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .nav-btn { width: 100%; text-align: left; background: none; border: none; color: #cbd5e1; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }
        
        main { padding: 30px; overflow-y: auto; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-info { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-info h3 { margin: 0; font-size: 14px; color: #64748b; }
        .card-info p { font-size: 28px; font-weight: bold; margin: 10px 0 0 0; }

        /* FORMULÁRIOS E TABELAS */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: white; padding: 25px; border-radius: 12px; }
        .full-width { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f8fafc; }
    </style>
</head>
<body>

    <section id="tela-login">
        <div class="card-login">
            <h1>RH System</h1>
            <p>Admin: admin@empresa.com | 123456</p>
            <form id="form-login">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-senha" placeholder="Senha" required>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
            <p id="erro-login" style="color: red; display: none; margin-top: 10px;">Dados inválidos!</p>
        </div>
    </section>

    <section id="sistema" class="layout hidden">
        <aside>
            <h2>RH Manager</h2>
            <nav>
                <button class="nav-btn active" onclick="mostrarSecao('dashboard')">📊 Dashboard</button>
                <button class="nav-btn" onclick="mostrarSecao('lista')">👥 Funcionários</button>
                <button class="nav-btn" onclick="mostrarSecao('cadastro')">➕ Novo Cadastro</button>
            </nav>
            <div style="margin-top: 50px;">
                <p id="user-logged" style="font-size: 12px;"></p>
                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">Sair</button>
            </div>
        </aside>

        <main>
            <div id="secao-dashboard" class="secao">
                <h1>Visão Geral</h1>
                <div class="grid-cards">
                    <div class="card-info">
                        <h3>Total Funcionários</h3>
                        <p id="dash-total">0</p>
                    </div>
                    <div class="card-info">
                        <h3>Folha Salarial</h3>
                        <p id="dash-folha">R$ 0,00</p>
                    </div>
                </div>
            </div>

            <div id="secao-lista" class="secao hidden">
                <h1>Funcionários Cadastrados</h1>
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cargo</th>
                            <th>Setor</th>
                            <th>Salário</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo"></tbody>
                </table>
            </div>

            <div id="secao-cadastro" class="secao hidden">
                <h1 id="titulo-form">Cadastrar Funcionário</h1>
                <form id="form-funcionario" class="form-grid">
                    <input type="hidden" id="edit-index">
                    
                    <div class="full-width">
                        <label>Nome Completo</label>
                        <input type="text" id="f-nome" required>
                    </div>
                    <div>
                        <label>Data de Nascimento</label>
                        <input type="date" id="f-nasc" required>
                    </div>
                    <div>
                        <label>CPF / Documento</label>
                        <input type="text" id="f-doc" required>
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" id="f-email" required>
                    </div>
                    <div>
                        <label>Estado Civil</label>
                        <select id="f-civil">
                            <option>Solteiro(a)</option>
                            <option>Casado(a)</option>
                            <option>Divorciado(a)</option>
                            <option>Viúvo(a)</option>
                        </select>
                    </div>
                    <div>
                        <label>Cargo</label>
                        <input type="text" id="f-cargo" required>
                    </div>
                    <div>
                        <label>Setor/Departamento</label>
                        <input type="text" id="f-setor" required>
                    </div>
                    <div>
                        <label>Data de Admissão</label>
                        <input type="date" id="f-adm" required>
                    </div>
                    <div>
                        <label>Salário (R$)</label>
                        <input type="number" step="0.01" id="f-salario" required>
                    </div>
                    <div>
                        <label>Vale Transporte (R$)</label>
                        <input type="number" step="0.01" id="f-vt">
                    </div>
                    <div>
                        <label>Vale Alimentação (R$)</label>
                        <input type="number" step="0.01" id="f-va">
                    </div>
                    <div>
                        <label>Plano de Saúde (R$)</label>
                        <input type="number" step="0.01" id="f-saude">
                    </div>

                    <div class="full-width">
                        <button type="submit" class="btn btn-success">Salvar Dados</button>
                        <button type="button" class="btn btn-danger" onclick="mostrarSecao('lista')">Cancelar</button>
                    </div>
                </form>
            </div>
        </main>
    </section>

    <script>
        // ESTADO DA APLICAÇÃO
        let funcionarios = JSON.parse(localStorage.getItem('rh_data')) || [];

        // CONSTANTES DE VALORES (PROJEÇÃO 2026)
        const SALARIO_MIN_ATUAL = 1582.00;
        const VALE_ALIM_PADRAO = 800.00;

        // LOGIN LOGIC
        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;

            if(email === 'admin@empresa.com' && senha === '123456') {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('sistema').classList.remove('hidden');
                document.getElementById('user-logged').innerText = `Logado como: ${email}`;
                atualizarTudo();
            } else {
                document.getElementById('erro-login').style.display = 'block';
            }
        });

        function logout() {
            document.getElementById('sistema').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('form-login').reset();
        }

        // NAVEGAÇÃO
        function mostrarSecao(id) {
            document.querySelectorAll('.secao').forEach(s => s.classList.add('hidden'));
            document.getElementById(`secao-${id}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            if(id === 'cadastro') {
                // Se o campo de índice estiver vazio, é um NOVO cadastro, então limpa o form
                if(document.getElementById('edit-index').value === "") {
                    limparFormulario();
                    document.getElementById('titulo-form').innerText = "Cadastrar Funcionário";
                }
            }
        }

        // FUNÇÃO PARA LIMPAR FORMULÁRIO E APLICAR VALORES PADRÃO
        function limparFormulario() {
            const form = document.getElementById('form-funcionario');
            form.reset();
            document.getElementById('edit-index').value = ""; // Reseta o controle de edição
            
            // Aplica os valores mínimos solicitados
            document.getElementById('f-salario').value = SALARIO_MIN_ATUAL;
            document.getElementById('f-va').value = VALE_ALIM_PADRAO;
        }

        // CRUD - SALVAR / EDITAR
        document.getElementById('form-funcionario').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const dados = {
                nome: document.getElementById('f-nome').value,
                nascimento: document.getElementById('f-nasc').value,
                doc: document.getElementById('f-doc').value,
                email: document.getElementById('f-email').value,
                civil: document.getElementById('f-civil').value,
                cargo: document.getElementById('f-cargo').value,
                setor: document.getElementById('f-setor').value,
                adm: document.getElementById('f-adm').value,
                salario: parseFloat(document.getElementById('f-salario').value),
                vt: parseFloat(document.getElementById('f-vt').value) || 0,
                va: parseFloat(document.getElementById('f-va').value) || 0,
                saude: parseFloat(document.getElementById('f-saude').value) || 0
            };

            const index = document.getElementById('edit-index').value;
            
            if(index === "") {
                funcionarios.push(dados);
            } else {
                funcionarios[index] = dados;
            }

            localStorage.setItem('rh_data', JSON.stringify(funcionarios));
            limparFormulario(); 
            atualizarTudo();
            mostrarSecao('lista');
        });

        function editarFuncionario(index) {
            const f = funcionarios[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('f-nome').value = f.nome;
            document.getElementById('f-nasc').value = f.nascimento;
            document.getElementById('f-doc').value = f.doc;
            document.getElementById('f-email').value = f.email;
            document.getElementById('f-civil').value = f.civil;
            document.getElementById('f-cargo').value = f.cargo;
            document.getElementById('f-setor').value = f.setor;
            document.getElementById('f-adm').value = f.adm;
            document.getElementById('f-salario').value = f.salario;
            document.getElementById('f-vt').value = f.vt;
            document.getElementById('f-va').value = f.va;
            document.getElementById('f-saude').value = f.saude;

            document.getElementById('titulo-form').innerText = "Editar Funcionário";
            mostrarSecao('cadastro');
        }

        function excluirFuncionario(index) {
            if(confirm("Deseja realmente excluir este funcionário?")) {
                funcionarios.splice(index, 1);
                localStorage.setItem('rh_data', JSON.stringify(funcionarios));
                atualizarTudo();
            }
        }

        // ATUALIZAR INTERFACE
        function atualizarTudo() {
            // Atualizar Dashboard
            document.getElementById('dash-total').innerText = funcionarios.length;
            const folha = funcionarios.reduce((acc, f) => acc + f.salario + f.vt + f.va + f.saude, 0);
            document.getElementById('dash-folha').innerText = folha.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            // Atualizar Tabela
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = "";
            
            funcionarios.forEach((f, index) => {
                corpo.innerHTML += `
                    <tr>
                        <td>${f.nome}</td>
                        <td>${f.cargo}</td>
                        <td>${f.setor}</td>
                        <td>R$ ${f.salario.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-primary" onclick="editarFuncionario(${index})">✏️</button>
                            <button class="btn btn-danger" onclick="excluirFuncionario(${index})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
